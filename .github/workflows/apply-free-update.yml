name: Apply reviewed daily and visual analysis release
on:
  push:
    branches: [main]
    paths: ['source-release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: range-source-and-pages-production
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify and apply the reviewed release
        env:
          EXPECTED_SHA256: cc9e27943ddf5bfae7018b2586cf4cad6b5bb132ba9f467462395adabb521219
        run: |
          python3 - <<'PYCODE'
          import hashlib,os,pathlib,json,base64,zipfile,io
          p=pathlib.Path('source-release.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256']
          release=json.loads(p.read_text());data=base64.b64decode(release['base64Zip'],validate=True)
          assert hashlib.sha256(data).hexdigest()==release['sha256']
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert sorted(z.namelist())==sorted(release['files'])
              for name in z.namelist():
                  q=pathlib.PurePosixPath(name)
                  assert not q.is_absolute() and '..' not in q.parts and '.git' not in q.parts
                  assert q.parts[0] in {'web','server','scripts','cloud','package.json','package-lock.json','README.txt'}
                  assert z.getinfo(name).file_size<3000000
              z.extractall('.')
          PYCODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server scripts cloud web package.json package-lock.json README.txt
          git diff --cached --quiet || git commit -m "Add lossless NEW product downloads and safe confirmation delivery"
          git pull --rebase
          git push
