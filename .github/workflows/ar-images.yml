name: Argos free native gallery review
on:
  push:
    branches: [main]
    paths: ['web/ar/manual-image-review.json', '.github/workflows/ar-images.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Argos exact public product baseline]
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: argos-free-native-gallery
  cancel-in-progress: false
jobs:
  images:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /server/
            /cloud/public-image.mjs
            /web/*.mjs
            /web/argos-acquisition-status.json
            /web/ar/
            /web/images/ar/
            /package.json
            /package-lock.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            runtime/models
            runtime/ar-previews
          key: ar-native-images-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ar-native-images-
      - name: Verify every saved exact product gallery through free native media
        run: node scripts/enrich-ar.mjs
      - name: Preserve exact free gallery previews even if a later review remains pending
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            runtime/models
            runtime/ar-previews
          key: ar-native-images-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Release all seven departments only after complete source and original-image acceptance
        run: node scripts/activate-ar.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: argos-native-gallery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/ar/gallery-audit.json
            web/ar/staged-catalogue.json.gz
            web/ar/image-index.json.gz
            web/ar/visual-cache.json.gz
            runtime/ar-previews/
          retention-days: 7
      - name: Preserve reviewed source images without activating an incomplete catalogue
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/ar web/images/ar web/retailer-activation.mjs web/argos-acquisition-status.json
          git diff --cached --quiet || git commit -m "Preserve Argos free native gallery and local review evidence [skip ci]"
          node scripts/push-evidence.mjs
      - name: Synchronize the accepted Argos NEW baseline without per-product mail
        if: success()
        run: node scripts/sync-ar-notifications.mjs
      - name: Persist the acknowledged Argos NEW baseline before publishing
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/ar/catalogue.json web/ar/staged-catalogue.json.gz web/ar/notification-baseline.json
          git diff --cached --quiet || git commit -m "Persist confirmed Argos NEW baseline and exact current snapshot [skip ci]"
          node scripts/push-evidence.mjs
      - name: Publish the Argos hierarchy without other source collection
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-retailer-site-publish.mjs ar
