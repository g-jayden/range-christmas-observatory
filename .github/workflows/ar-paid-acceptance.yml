name: Argos authorised shared-session directory acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: argos-paid-source-acceptance
  cancel-in-progress: false
jobs:
  paid-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/probe-argos-paid.mjs
            /web/argos-collection-authorization.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: One authorised paid browser request for the six official directories
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/probe-argos-paid.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: argos-authorised-directory-evidence-${{ github.run_id }}
          path: runtime/argos-paid-acceptance
          retention-days: 3
