name: ASDA Christmas exact SKU collection
on:
  push:
    branches: [main]
    paths: ['web/asda/request.json', 'server/asda-*.mjs', 'scripts/update-asda.mjs', '.github/workflows/asda.yml']
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: range-source-and-pages-production
  cancel-in-progress: false
jobs:
  asda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-asda.mjs
      - uses: actions/cache@v6.1.0
        with:
          path: |
            runtime/models
            runtime/fonts
          key: local-clip-vit-base-patch32-q8-v1
      - name: Collect one shared ASDA catalogue and changed exact SKU details
        run: node scripts/update-asda.mjs
      - name: Verify full-product previews and colours locally without Firecrawl
        run: node scripts/enrich-asda.mjs
      - name: Prepare only newly observed ASDA notifications
        run: node scripts/prepare-asda-notifications.mjs
      - name: Preserve paid source checkpoints even after a partial failure
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p web/images/asda web/mail-assets
          git add web/asda web/images/asda web/mail-assets web/collection-ledger.json
          git diff --cached --quiet || git commit -m "Save verified ASDA catalogue and exact SKU checkpoints"
          node scripts/push-evidence.mjs
      - name: Deliver from the durable published attachment version
        run: node scripts/deliver-asda-notifications.mjs
