name: Credit controlled collection and permanent website
on:
  push:
    branches: [main]
    paths-ignore: ['web/catalogue.json', 'web/status.json', 'web/settings.json', 'web/collection-ledger.json', 'web/images/**', 'web/mail-assets/**', 'web/monitor-state.json', 'web/new-arrivals.json', 'web/monitor-proof.json', 'web/visual-cache.json', 'web/notification-readiness.json']
  schedule:
    - cron: '0 23 * * *'
    - cron: '1 23 * * *'
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh official source data before publishing
        type: boolean
        default: true
      mode:
        description: Source collection mode
        type: choice
        options: [verify-all, catalogue, catalogue-probe, probe, repair, monitor-probe, mail-recovery, lights-init, themes-init, previews, asda, publish]
        default: verify-all
      checkNew:
        description: Check NEW now without changing the regular schedule
        type: boolean
        default: false
      repairScope:
        description: Evidence to repair without re-reading the catalogue
        type: choice
        options: [trees-and-skirts, decorations, lights]
        default: trees-and-skirts
      runner:
        description: Standard free public-repository runner
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: ubuntu-latest
      browser:
        description: Standard browser engine
        type: choice
        options: [firecrawl-browser]
        default: firecrawl-browser
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: range-source-and-pages-production
  cancel-in-progress: false
  queue: max
jobs:
  website:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      COLLECTION_MODE: ${{ inputs.mode || 'verify-all' }}
      COLLECTION_HEADLESS: 'false'
      COLLECTION_PROVIDER: firecrawl-browser
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/
            /server/
            /cloud/delivery-policy.mjs
            /cloud/source-recovery.mjs
            /cloud/evidence-recovery.mjs
            /cloud/monitor-owner.mjs
            /web/settings.json
            /web/status.json
            /web/monitor-state.json
            /web/catalogue.json
            /web/asda/request.json
            /web/asda-model.mjs
            /web/bm-model.mjs
            /web/ms-model.mjs
            /web/retailers.mjs
            /web/catalogue-model.mjs
            /web/collection-policy.json
            /web/collection-ledger.json
            /web/collection-diagnostics.json
            /web/notification-readiness.json
            /web/service.json
            /web/evidence-repair-request.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check the configured full and NEW schedules
        id: tick
        env:
          MANUAL_REFRESH: ${{ inputs.refresh }}
          FORCE_MONITOR: ${{ inputs.checkNew && 'true' || 'false' }}
        run: node scripts/schedule-tick.mjs
      - name: Load image files only for a real collection or publication
        if: steps.tick.outputs.publish == 'true' || steps.tick.outputs.work == 'true' || inputs.mode == 'probe' || inputs.mode == 'repair' || inputs.mode == 'monitor-probe' || inputs.mode == 'previews' || (inputs.mode == 'lights-init' || inputs.mode == 'themes-init')
        run: git sparse-checkout disable
      - name: Install collection and local image analysis clients
        if: steps.tick.outputs.publish == 'true' || steps.tick.outputs.work == 'true' || inputs.mode == 'probe' || inputs.mode == 'repair' || inputs.mode == 'monitor-probe' || inputs.mode == 'previews' || (inputs.mode == 'lights-init' || inputs.mode == 'themes-init')
        run: npm install --no-audit --no-fund
      - name: Verify source integrity, SKU matching and credit limits
        if: steps.tick.outputs.publish == 'true' || inputs.mode == 'probe'
        run: npm test
      - name: Verify catalogue-only transport without loading product assets
        if: inputs.mode == 'catalogue-probe'
        run: node scripts/test-catalogue-transport.mjs
      - name: Restore reusable local vision model
        if: steps.tick.outputs.publish == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            runtime/models
            runtime/fonts
          key: local-clip-vit-base-patch32-q8-v1
      - name: Persist the daily claim before opening a paid session
        if: steps.tick.outputs.monitor == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/monitor-state.json
          git diff --cached --quiet || git commit -m "Claim this Beijing daily NEW check exactly once"
          git pull --rebase
          git push
      - name: Check private notification readiness without exposing addresses
        if: steps.tick.outputs.publish == 'true'
        run: node scripts/mail-readiness.mjs
      - name: Persist the one-time evidence repair claim before paid requests
        if: steps.tick.outputs.evidence_repair == 'true'
        run: |
          node scripts/claim-evidence-repair.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/evidence-repair-request.json web/notification-readiness.json web/monitor-state.json web/collection-ledger.json
          git commit -m "Claim bounded existing-product evidence repair [skip ci]"
          node scripts/push-evidence.mjs
      - name: Reserve the run budget before opening a paid session
        id: budget
        if: steps.tick.outputs.work == 'true' || steps.tick.outputs.evidence_repair == 'true' || (inputs.mode == 'probe' || inputs.mode == 'catalogue-probe') || inputs.mode == 'repair' || inputs.mode == 'monitor-probe' || inputs.mode == 'previews' || (inputs.mode == 'lights-init' || inputs.mode == 'themes-init')
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          node scripts/release-unused-reservations.mjs
          node scripts/reserve-credits.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/collection-ledger.json web/notification-readiness.json
          git diff --cached --quiet || git commit -m "Reserve the bounded Firecrawl collection budget"
          git pull --rebase
          git push
      - name: Restore resumable free collection state
        if: (steps.tick.outputs.work == 'true' || inputs.mode == 'repair' || inputs.mode == 'monitor-probe' || inputs.mode == 'previews' || (inputs.mode == 'lights-init' || inputs.mode == 'themes-init'))
        uses: actions/cache/restore@v6.1.0
        with:
          path: runtime/collection
          key: firecrawl-collection-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: firecrawl-collection-
      - name: Prove the complete source, exact variant and screenshot route
        id: probe
        if: inputs.mode == 'probe' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/probe-free-source.mjs
      - name: Prove batched catalogue transport with one bounded request
        id: catalogue_probe
        if: inputs.mode == 'catalogue-probe' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/probe-catalogue-transport.mjs
      - name: Collect official source data in a time-billed Firecrawl session
        id: refresh
        if: (steps.tick.outputs.work == 'true' || inputs.mode == 'monitor-probe') && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          COLLECTION_CHECKPOINTS: '1'
        run: node server/update-daily.mjs
      - name: Repair only existing abnormal product evidence
        id: evidence_repair
        if: steps.tick.outputs.evidence_repair == 'true' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/repair-product-evidence.mjs
      - name: Initialize six lighting scopes and refresh all source price markers
        id: lights
        if: inputs.mode == 'lights-init' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node server/initialize-lights.mjs
      - name: Initialize official themes and repair native original image maps
        id: themes
        if: inputs.mode == 'themes-init' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node server/initialize-themes.mjs
      - name: Repair remaining SKU evidence and verify original images
        id: repair
        if: inputs.mode == 'repair' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          REPAIR_SCOPE: ${{ inputs.repairScope }}
        run: node scripts/run-repair.mjs
      - name: Select whole-product previews from existing exact-SKU galleries
        id: previews
        if: inputs.mode == 'previews' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/optimise-product-previews.mjs
      - name: Collect ASDA within the remaining shared run budget
        id: asda
        if: steps.tick.outputs.asda == 'true'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          COLLECTION_CHECKPOINTS: '1'
        run: |
          node scripts/update-asda.mjs
          node scripts/enrich-asda.mjs
          node scripts/prepare-asda-notifications.mjs
      - name: Complete the selected interval
        if: always() && steps.tick.outputs.full == 'true' && steps.refresh.outcome != 'skipped'
        env:
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.catalogue_success == 'true' }}
          SCHEDULE_LEASE: ${{ steps.tick.outputs.full_lease }}
        run: node scripts/complete-full.mjs
      - name: Release this run's unfinished NEW claim
        if: always() && steps.tick.outputs.monitor == 'true'
        run: node scripts/release-unused-monitor.mjs
      - name: Save collection checkpoints
        if: always() && steps.tick.outputs.work == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: runtime/collection
          key: firecrawl-collection-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Recover previously captured NEW files without source requests
        if: steps.tick.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/restore-new-artifacts.mjs
      - name: Apply cached picture reviews and bilingual source materials
        if: steps.tick.outputs.publish == 'true'
        run: node scripts/enrich-appearance.mjs
      - name: Verify previews preserve product facts and all four reported examples
        if: inputs.mode == 'previews' && steps.previews.outcome == 'success'
        run: node scripts/verify-product-previews.mjs
      - name: Keep the private NEW queue aligned with verified classifications
        if: steps.tick.outputs.publish == 'true'
        run: |
          node scripts/repair-mail-formats.mjs
          node scripts/sync-taxonomy-queue.mjs
      - name: Finalize saved lighting baseline without source requests
        if: steps.tick.outputs.publish == 'true'
        run: node scripts/finalize-lights.mjs
      - name: Archive paid ASDA source data before repository publication
        if: always() && steps.tick.outputs.asda == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/asda/
            web/collection-ledger.json
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
      - name: Preserve data and source status
        id: evidence
        if: always() && (steps.tick.outputs.publish == 'true' || (inputs.mode == 'probe' || inputs.mode == 'catalogue-probe'))
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p web/mail-assets
          git add web
          git diff --cached --quiet || git commit -m "Update free-source catalogue and verification status"
          node scripts/push-evidence.mjs
      - name: Send verified NEW emails from committed, accessible native attachments
        id: delivery
        continue-on-error: true
        if: steps.evidence.outcome == 'success' && steps.tick.outputs.publish == 'true'
        run: |
          mail_status=0
          node scripts/deliver-committed-notifications.mjs || mail_status=$?
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/monitor-state.json web/status.json web/collection-ledger.json web/notification-readiness.json
          git diff --cached --quiet || git commit -m "Record durable NEW delivery result"
          node scripts/push-evidence.mjs
          exit "$mail_status"
      - uses: actions/configure-pages@v6.0.0
        if: steps.tick.outputs.publish == 'true'
      - name: Build site
        if: steps.tick.outputs.publish == 'true'
        run: node scripts/build-static.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.tick.outputs.publish == 'true'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Publish permanent website
        id: deployment
        if: steps.tick.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/publish-pages.mjs
      - name: Save the real source and credit proof
        if: always() && ((inputs.mode == 'probe' || inputs.mode == 'catalogue-probe') || inputs.mode == 'monitor-probe' || inputs.mode == 'previews' || (inputs.mode == 'lights-init' || inputs.mode == 'themes-init'))
        uses: actions/upload-artifact@v7.0.2
        with:
          name: free-source-proof
          path: |
            runtime/free-source-proof.json
            runtime/catalogue-transport-proof.json
            runtime/preview-collection-proof.json
            runtime/preview-facts-before.json
            runtime/daily-new-screenshot.png
          retention-days: 3
      - name: Report unsuccessful source collection
        if: steps.delivery.outcome == 'failure' || steps.evidence_repair.outcome == 'failure' || steps.catalogue_probe.outcome == 'failure' || steps.refresh.outcome == 'failure' || steps.budget.outcome == 'failure' || steps.probe.outcome == 'failure' || steps.repair.outcome == 'failure' || steps.lights.outcome == 'failure' || steps.themes.outcome == 'failure' || steps.previews.outcome == 'failure'
        run: exit 1
