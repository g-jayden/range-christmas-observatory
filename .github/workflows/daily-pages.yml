name: Free source collection and permanent website
on:
  push:
    branches: [main]
    paths-ignore: ['web/catalogue.json', 'web/status.json', 'web/settings.json', 'web/collection-ledger.json', 'web/images/**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh official source data before publishing
        type: boolean
        default: true
      mode:
        description: Source collection mode
        type: choice
        options: [verify-all, catalogue, probe]
        default: verify-all
      checkNew:
        description: Check NEW now without changing the regular schedule
        type: boolean
        default: false
      runner:
        description: Standard free public-repository runner
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: ubuntu-latest
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: range-source-and-pages-${{ inputs.mode == 'probe' && inputs.runner || 'production' }}
  cancel-in-progress: false
jobs:
  website:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 350
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      COLLECTION_MODE: ${{ inputs.mode || 'verify-all' }}
      COLLECTION_HEADLESS: 'false'
      COLLECTION_BROWSER_CHANNEL: chrome
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check the configured full and NEW schedules
        id: tick
        env:
          MANUAL_REFRESH: ${{ inputs.refresh }}
          FORCE_MONITOR: ${{ inputs.checkNew && 'true' || 'false' }}
        run: node scripts/schedule-tick.mjs
      - name: Verify source integrity and zero-Firecrawl safeguards
        if: steps.tick.outputs.publish == 'true' || inputs.mode == 'probe'
        run: npm test
      - name: Install the open source browser collector
        if: steps.tick.outputs.work == 'true' || inputs.mode == 'probe'
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chrome
      - name: Restore resumable free collection state
        if: steps.tick.outputs.work == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: runtime/collection
          key: native-collection-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-collection-
      - name: Prove the free API, exact SKU and screenshot route
        if: inputs.mode == 'probe'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/probe-free-source.mjs
          else
            node scripts/probe-free-source.mjs
          fi
      - name: Collect official source data without Firecrawl
        id: refresh
        if: steps.tick.outputs.work == 'true'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node server/update-daily.mjs
          else
            node server/update-daily.mjs
          fi
      - name: Complete the selected interval
        if: always() && steps.tick.outputs.full == 'true' && steps.refresh.outcome != 'skipped'
        env:
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.catalogue_success == 'true' }}
          SCHEDULE_LEASE: ${{ steps.tick.outputs.full_lease }}
        run: node scripts/complete-full.mjs
      - name: Save collection checkpoints
        if: always() && steps.tick.outputs.work == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: runtime/collection
          key: native-collection-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve data and source status
        if: steps.tick.outputs.publish == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/catalogue.json web/status.json web/settings.json web/collection-ledger.json web/images
          git diff --cached --quiet || git commit -m "Update free-source catalogue and verification status"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v6.0.0
        if: steps.tick.outputs.publish == 'true'
      - name: Build site
        if: steps.tick.outputs.publish == 'true'
        run: node scripts/build-static.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.tick.outputs.publish == 'true'
        with:
          path: public
      - name: Publish permanent website
        id: deployment
        if: steps.tick.outputs.publish == 'true'
        uses: actions/deploy-pages@v5.0.1
      - name: Save the real free-source proof
        if: always() && inputs.mode == 'probe'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: free-source-proof
          path: runtime/free-source-proof.json
          retention-days: 3
      - name: Report unsuccessful source collection
        if: steps.refresh.outcome == 'failure'
        run: exit 1
