name: Home Bargains Christmas exact SKU collection
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, native, enrich, activate, daily]
        default: collect
permissions:
  contents: write
  actions: write
concurrency:
  group: range-source-and-pages-production
  cancel-in-progress: false
  queue: max
jobs:
  hb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      COLLECTION_CHECKPOINTS: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/
            /server/
            /cloud/
            /test/
            /web/*.mjs
            /web/*.json
            /web/hb/
            /web/images/hb/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/test-hb.mjs
      - uses: actions/cache@v6.1.0
        with:
          path: |
            runtime/models
            runtime/fonts
          key: local-clip-vit-base-patch32-q8-v1
      - name: Read nine Home Bargains directories and exact variants in one Firecrawl browser request
        if: inputs.mode == 'collect' || inputs.mode == 'native' || inputs.mode == 'daily'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          HB_ONBOARDING_FIRECRAWL: ${{ inputs.mode == 'collect' }}
          HB_NATIVE_ONLY: ${{ inputs.mode == 'native' }}
          HB_FORCE: ${{ inputs.mode == 'native' }}
        run: node scripts/update-hb.mjs
      - name: Rebuild from saved exact-family evidence without source requests
        if: inputs.mode == 'enrich' || inputs.mode == 'activate'
        env:
          HB_REBUILD_ONLY: 'true'
        run: node scripts/update-hb.mjs
      - name: Verify whole-product photos and colours locally
        if: inputs.mode == 'enrich' || inputs.mode == 'activate' || inputs.mode == 'daily'
        run: node scripts/enrich-hb.mjs
      - name: Prepare only first-observed NEW after the initial baseline
        if: inputs.mode == 'activate' || inputs.mode == 'daily'
        run: node scripts/prepare-hb-notifications.mjs
      - name: Preserve Home Bargains evidence without recollecting other retailers
        id: evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p web/hb web/images/hb web/mail-assets
          git add --sparse -- web/hb web/images/hb web/mail-assets web/collection-ledger.json web/preview-quality-cache.json.gz
          git diff --cached --quiet || git commit -m "Save verified Home Bargains exact SKU catalogue and image evidence [skip ci]"
          node scripts/push-evidence.mjs
      - name: Deliver verified published Home Bargains attachments
        if: always() && (inputs.mode == 'activate' || inputs.mode == 'daily')
        run: node scripts/deliver-hb-notifications.mjs
      - name: Refresh the canonical website from committed Home Bargains data without source requests
        if: always() && steps.evidence.outcome == 'success' && (inputs.mode == 'enrich' || inputs.mode == 'activate' || inputs.mode == 'daily')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-hb-site-publish.mjs
