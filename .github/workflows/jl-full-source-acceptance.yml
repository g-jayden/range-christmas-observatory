name: John Lewis complete official source acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            server/jl-source.mjs
            server/jl-list-dom.mjs
            web/jl-model.mjs
            web/jl-physical.mjs
            scripts/collect-jl-source.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install official Firefox runtime
        run: |
          npm install --prefix runtime/jl-probe --no-audit --no-fund --ignore-scripts playwright@1.64.1
          node runtime/jl-probe/node_modules/playwright/cli.js install --with-deps firefox
      - name: Verify every directory, product family and exact variant
        run: node scripts/collect-jl-source.mjs
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: john-lewis-complete-public-source
          path: runtime/jl-source-acceptance
          retention-days: 3
