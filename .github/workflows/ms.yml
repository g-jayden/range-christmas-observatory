name: M&S Christmas exact SKU collection
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, enrich, activate, daily]
        default: collect
permissions:
  contents: write
  actions: write
concurrency:
  group: range-ms-source
  cancel-in-progress: false
  queue: max
jobs:
  ms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      COLLECTION_CHECKPOINTS: '1'
      EVIDENCE_ISOLATE_WORKTREE: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/
            /server/
            /cloud/
            /test/
            /web/*.mjs
            /web/*.json
            /web/preview-quality-cache.json.gz
            /web/mail-assets/ms-*/
            /web/ms/
            /web/images/ms/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/test-ms.mjs
      - uses: actions/cache@v6.1.0
        with:
          path: |
            runtime/models
            runtime/fonts
          key: local-clip-vit-base-patch32-q8-v1
      - name: Read six M&S directories and each exact product family once
        if: inputs.mode == 'collect' || inputs.mode == 'daily'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/update-ms.mjs
      - name: Verify whole-product photos and colours locally
        if: inputs.mode == 'enrich' || inputs.mode == 'activate' || inputs.mode == 'daily'
        run: node scripts/enrich-ms.mjs
      - name: Verify the production runner can read real M&S products and native photos
        if: inputs.mode == 'activate'
        run: node scripts/verify-ms-live-channel.mjs
      - name: Prepare only first-observed NEW after the initial baseline
        if: inputs.mode == 'activate' || inputs.mode == 'daily'
        run: node scripts/prepare-ms-notifications.mjs
      - name: Archive exact source and native evidence before publication
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ms-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/ms/
            web/images/ms/
            web/collection-ledger.json
            web/preview-quality-cache.json.gz
          retention-days: 3
          compression-level: 9
          if-no-files-found: warn
      - name: Preserve M&S evidence without recollecting other retailers
        id: evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p web/ms web/images/ms web/mail-assets
          git add --sparse -- web/ms web/images/ms web/mail-assets web/collection-ledger.json
          git diff --cached --quiet || git commit -m "Save verified M&S exact SKU catalogue and image evidence [skip ci]"
          node scripts/push-evidence.mjs
      - name: Deliver verified published M&S attachments
        if: always() && steps.evidence.outcome == 'success' && (inputs.mode == 'activate' || inputs.mode == 'daily')
        run: node scripts/deliver-ms-notifications.mjs
      - name: Refresh the canonical website from committed M&S data without source requests
        if: always() && steps.evidence.outcome == 'success' && (inputs.mode == 'enrich' || inputs.mode == 'activate' || inputs.mode == 'daily')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-ms-site-publish.mjs
