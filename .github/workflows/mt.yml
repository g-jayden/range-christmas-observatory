name: Matalan free exact SKU collection and native photos
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      rebuildOnly:
        description: Reuse saved complete source without directory or detail requests
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: range-mt-source
  cancel-in-progress: false
  queue: max
jobs:
  matalan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout: |
            /.github/
            /package.json
            /package-lock.json
            /.npmrc
            /.gitignore
            /server/
            /scripts/
            /cloud/
            /test/
            /web/*.mjs
            /web/settings.json
            /web/preview-quality-cache.json.gz
            /web/mt/
            /web/images/mt/
            /web/mail-assets/mt-*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/test-mt.mjs
      - name: Read all six official directories, NEW badges and exact variant offers free
        env:
          MT_REBUILD_ONLY: ${{ inputs.rebuildOnly == true && 'true' || 'false' }}
        run: node scripts/update-mt.mjs
      - uses: actions/cache@v6.1.0
        with:
          path: |
            runtime/models
            runtime/fonts
          key: local-clip-vit-base-patch32-q8-v1
      - name: Verify originals and local body colours without paid requests
        run: |
          node scripts/enrich-mt.mjs
          node scripts/dedupe-mt.mjs
      - name: Prepare verified first-observed arrivals after the initial baseline
        run: node scripts/prepare-retailer-notifications.mjs mt
      - name: Preserve source checkpoints and native evidence even on partial failure
        id: evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p web/mt web/images/mt web/mail-assets
          git add web/mt web/images/mt
          for retailer_mail_dir in web/mail-assets/mt-*/; do
            if [ -d "$retailer_mail_dir" ]; then git add "$retailer_mail_dir"; fi
          done
          git diff --cached --quiet || git commit -m "Save Matalan exact SKU source and reviewed native evidence [skip ci]"
          node scripts/push-evidence.mjs
      - name: Deliver only committed verified Matalan arrivals
        if: success()
        run: node scripts/deliver-retailer-notifications.mjs mt
      - name: Publish without recollecting other retailers
        if: steps.evidence.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-retailer-site-publish.mjs mt
