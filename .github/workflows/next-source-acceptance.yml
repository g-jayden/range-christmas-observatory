name: Next current integration source acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-current-integration-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            scripts/probe-next-source.mjs
            server/nx-bulk-request.mjs
            server/nx-source.mjs
            web/nx-model.mjs
            web/nx-physical.mjs
            web/next-integration-authorization.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Read Next official sources under current one-time authorization
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/probe-next-source.mjs
