name: Diagnose the saved Pages artifact without recollecting products
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-diagnostic.yml']
  workflow_dispatch:
permissions:
  actions: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Inspect the existing failed deployment and ZIP directory only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo='g-jayden/range-christmas-observatory',root='https://api.github.com/repos/'+repo,headers={authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},sha='ca43b93e33a1ecd3333b3b4713f0d30dcd5f183e',artifact=14917021051;
          const deployment=await fetch(root+'/pages/deployments/'+sha,{headers,signal:AbortSignal.timeout(20000)}),d=await deployment.json();
          console.log(JSON.stringify({phase:'saved-pages-deployment-diagnostic',http:deployment.status,status:d.status,error:d.error,message:d.message,progress:d.progress,statusKeys:Object.keys(d),sourceRequests:0,firecrawlCredits:0}));
          const details=await fetch(root+'/actions/artifacts/'+artifact,{headers,signal:AbortSignal.timeout(20000)}),a=await details.json();if(!details.ok)throw Error('Saved artifact metadata '+details.status);
          console.log(JSON.stringify({phase:'saved-artifact-metadata',id:a.id,name:a.name,archiveBytes:a.size_in_bytes,expired:a.expired}));
          const redirect=await fetch(root+'/actions/artifacts/'+artifact+'/zip',{headers,redirect:'manual',signal:AbortSignal.timeout(20000)});if(redirect.status!==302)throw Error('Saved artifact redirect '+redirect.status);
          const target=new URL(redirect.headers.get('location'));if(target.protocol!=='https:'||!['.blob.core.windows.net','.githubusercontent.com','.actions.githubusercontent.com'].some(s=>target.hostname.endsWith(s)))throw Error('Unexpected official artifact storage host');
          const head=await fetch(target,{method:'HEAD',signal:AbortSignal.timeout(20000)}),size=Number(head.headers.get('content-length'));if(!head.ok||!Number.isSafeInteger(size)||size<22)throw Error('Official artifact HEAD size unavailable');console.log(JSON.stringify({phase:'artifact-zip-size',size,http:head.status}));
          const tail=await fetch(target,{headers:{Range:'bytes='+Math.max(0,size-65557)+'-'+(size-1)},signal:AbortSignal.timeout(30000)});if(tail.status!==206){await tail.body?.cancel();throw Error('Artifact storage did not support a bounded tail read: '+tail.status);}
          const bytes=Buffer.from(await tail.arrayBuffer());if(bytes.length>65557)throw Error('Unbounded ZIP tail');const entries=[];
          for(let i=0;i+46<=bytes.length;i++){if(bytes.readUInt32LE(i)!==0x02014b50)continue;const nameLength=bytes.readUInt16LE(i+28),extraLength=bytes.readUInt16LE(i+30),commentLength=bytes.readUInt16LE(i+32);if(i+46+nameLength+extraLength+commentLength>bytes.length)continue;const name=bytes.subarray(i+46,i+46+nameLength).toString('utf8');let uncompressed=bytes.readUInt32LE(i+24);if(uncompressed===0xffffffff){let e=i+46+nameLength,end=e+extraLength;while(e+4<=end){const type=bytes.readUInt16LE(e),len=bytes.readUInt16LE(e+2);if(type===1&&len>=8){uncompressed=Number(bytes.readBigUInt64LE(e+4));break;}e+=4+len;}}entries.push({name,uncompressedBytes:uncompressed});i+=45+nameLength+extraLength+commentLength;}
          if(!entries.length)throw Error('ZIP directory unavailable in bounded tail');console.log(JSON.stringify({phase:'saved-pages-unpacked-size',entries,tailBytes:bytes.length,sourceRequests:0,firecrawlCredits:0}));
          JS
