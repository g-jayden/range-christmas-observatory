name: Diagnose free public Range browser access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
            !/web/mail-assets/
            !/web/reports/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read official public pages in a standard browser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/probe-range-public-browser.mjs
          else
            node scripts/probe-range-public-browser.mjs
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: range-public-browser-${{ matrix.os }}-${{ github.run_id }}
          path: runtime/range-public-browser-proof.json
          retention-days: 3
