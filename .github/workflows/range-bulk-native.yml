name: The Range bulk native originals independently of daily checks
on:
  workflow_run:
    workflows: [Credit controlled collection and permanent website]
    types: [completed]
  workflow_dispatch:
    inputs:
      continuationDepth:
        description: Continue only durably saved image progress; no approved count ceiling
        type: string
        default: '0'
permissions:
  contents: write
  actions: write
concurrency:
  group: range-full-gallery-native-recovery
  cancel-in-progress: false
  queue: max
jobs:
  exact-originals:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      RANGE_NATIVE_CHECKPOINTS: '1'
      RANGE_NATIVE_CONTINUATION_DEPTH: ${{ inputs.continuationDepth || '0' }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/
            /web/*.mjs
            /web/*.js
            /web/*.json
            /web/*.gz
            /web/decoration-details/
            /web/light-details/
            /web/theme-details/
            /web/original-image-map/
            /web/spring/candidate-catalogue.json
            /web/spring/review.json
            /web/spring/status.json
            /web/spring/source.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        if: github.event_name == 'push'
        with:
          name: range-bulk-native-44707655282-1
          run-id: 44707655282
          github-token: ${{ github.token }}
          path: runtime/restore-range-native
      - name: Restore the failed checkpoint without collecting its photos again
        if: github.event_name == 'push'
        run: |
          git fetch --filter=blob:none --depth=1 origin 11fb929080780021767ac281d7fbd78d38808eec
          node scripts/restore-range-native-artifact.mjs
      - name: Recover missing originals in verified native batches, never recollect directories
        run: node scripts/mirror-range-originals.mjs
      - name: Recover sparse unpushed original blobs before archiving
        if: always()
        continue-on-error: true
        run: node scripts/prepare-native-recovery-archive.mjs
      - name: Keep a recoverable archive after any outcome
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/upload-artifact@v7.0.2
        with:
          name: range-bulk-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/native-recovery-saved/
          retention-days: 3
      - name: Publish saved originals without source collection
        if: success()
        run: node scripts/request-retailer-site-publish.mjs ar
      - name: Continue only saved progress after successful publication
        if: success()
        run: node scripts/continue-range-bulk-native.mjs
      - name: Verify saved native bindings with an explicit dispatch
        if: success()
        run: |
          node --input-type=module - <<'JS'
          const r=await fetch('https://api.github.com/repos/g-jayden/range-christmas-observatory/actions/workflows/native-images.yml/dispatches',{method:'POST',headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({ref:'main',inputs:{continuationDepth:'0'}}),signal:AbortSignal.timeout(20000)});if(r.status!==204)throw Error('Native verification dispatch HTTP '+r.status);console.log(JSON.stringify({nativeVerificationRequested:true,sourceRequests:0,firecrawlCredits:0}));
          JS
