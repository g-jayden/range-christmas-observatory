name: Diagnose exact missing image galleries using approved native allowance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/range-image-gallery-discovery.yml']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
            !/web/mail-assets/
            !/web/reports/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-range-image-gallery.mjs
      - run: node scripts/discover-range-image-galleries.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: image-gallery-discovery-${{ github.run_id }}
          path: runtime/image-gallery-discovery-proof.json
          retention-days: 3
