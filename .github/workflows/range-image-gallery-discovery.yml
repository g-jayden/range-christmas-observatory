name: Diagnose exact missing image galleries using approved native allowance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/range-image-gallery-discovery.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: approved-native-image-recovery
  cancel-in-progress: false
  queue: max
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
            !/web/mail-assets/
            !/web/reports/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-range-image-gallery.mjs
      - run: node scripts/discover-range-image-galleries.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: image-gallery-discovery-${{ github.run_id }}
          path: runtime/image-gallery-discovery-proof.json
          retention-days: 3
      - name: Recover independently verified native bytes after gallery discovery
        if: success()
        run: |
          node --input-type=module - <<'JS'
          const r=await fetch('https://api.github.com/repos/g-jayden/range-christmas-observatory/actions/workflows/range-bulk-native.yml/dispatches',{method:'POST',headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({ref:'main',inputs:{continuationDepth:'0'}}),signal:AbortSignal.timeout(20000)});if(r.status!==204)throw Error('Native recovery dispatch HTTP '+r.status);console.log(JSON.stringify({nativeRecoveryRequested:true,sourceDirectoriesRequested:0,firecrawlCredits:0}));
          JS
