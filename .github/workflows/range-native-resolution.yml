name: Recover exact priority Range native originals
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: range-native-resolution-inspection
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
            !/web/reports/
            !/web/mail-assets/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Reserve general collection only for legacy source inspection
        if: ${{ hashFiles('ops/priority-native-request.json') == '' }}
        run: node scripts/reserve-credits.mjs
      - name: Verify exact current priority scope before source access
        run: node scripts/test-priority-native-request.mjs
      - name: Recover only current requested native gallery frames
        run: |
          if test -f ops/priority-native-request.json; then
            node scripts/mirror-priority-range-native.mjs
          else
            node scripts/mirror-confirmed-range-native-pair.mjs
          fi
      - name: Preserve source evidence independently of Git publication
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: range-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/range-native-resolution-inspection.json
            web/range-native-index.json
            web/range-native-gallery.json
            runtime/priority-native-checkpoint.json
            web/collection-ledger.json
            web/range-residual-reviewed-evidence.json
            web/images/source
          retention-days: 7
      - name: Save source evidence and actual receipt without changing catalogue facts
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for file in web/range-native-resolution-inspection.json web/collection-ledger.json web/range-residual-reviewed-evidence.json web/range-native-index.json web/range-native-gallery.json; do
            if test -f "$file"; then git add --sparse -- "$file"; fi
          done
          if test -d web/images/source; then git add --sparse -- web/images/source; fi
          git diff --cached --quiet || git commit -m "Save exact four low-resolution product source documents for review [skip ci]"
          node scripts/push-evidence.mjs

      - name: Publish repaired native bindings without source collection
        if: success()
        run: node scripts/request-retailer-site-publish.mjs ar
