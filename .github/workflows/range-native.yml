name: The Range native originals without catalogue recollection
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: range-source-and-pages-production
  cancel-in-progress: false
  queue: max
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mirror only missing exact official native originals within the approved budget
        run: node scripts/mirror-range-originals.mjs
      - name: Save original response bytes and receipts even after a partial source failure
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p web/images/source
          git add web/range-native*.json web/images/source web/collection-ledger.json
          git diff --cached --quiet || git commit -m "Save exact official full-resolution source photos and receipts [skip ci]"
          node scripts/push-evidence.mjs
      - name: Publish the saved original mirrors without source collection
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-retailer-site-publish.mjs ar
