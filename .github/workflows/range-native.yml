name: The Range native originals without catalogue recollection
on:
  workflow_dispatch:
    inputs:
      imageRole:
        description: Recover missing current listing previews separately from original-resolution exports
        type: choice
        options: [originals, listing-previews]
        default: originals
      continuationDepth:
        description: Bounded missing-only continuation, maximum 8
        type: string
        default: '0'
permissions:
  contents: write
  actions: write
concurrency:
  group: range-source-and-pages-production
  cancel-in-progress: false
  queue: max
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      RANGE_NATIVE_CHECKPOINTS: '1'
      RANGE_NATIVE_CONTINUATION_DEPTH: ${{ inputs.continuationDepth || '0' }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mirror only missing exact official native originals within the approved budget
        if: inputs.imageRole != 'listing-previews'
        run: node scripts/mirror-range-originals.mjs
      - uses: actions/cache@v6.1.0
        if: inputs.imageRole == 'listing-previews'
        with:
          path: |
            runtime/models
            runtime/fonts
          key: local-clip-vit-base-patch32-q8-v1
      - name: Recover only missing exact current listing pictures without directory or detail collection
        if: inputs.imageRole == 'listing-previews'
        env:
          COLLECTION_CHECKPOINTS: '1'
        run: node scripts/repair-range-previews.mjs
      - name: Preserve a recoverable archive after any outcome
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/upload-artifact@v7.0.2
        with:
          name: range-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/range-native*.json
            web/range-preview*.json
            web/browser-image-recovery.json
            web/product-evidence-health.json
            web/collection-ledger.json
          retention-days: 3
      - name: Publish the saved original mirrors without source collection
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-retailer-site-publish.mjs ar
      - name: Continue only after durable progress within the approved budget
        if: success() && inputs.imageRole != 'listing-previews'
        run: node scripts/continue-range-native.mjs
