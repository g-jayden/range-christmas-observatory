name: Remove duplicate waiting image scans before restoring saved originals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-old-publisher.yml']
  workflow_dispatch:
permissions:
  actions: write
jobs:
  release-only-waiting-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Retain every active capture and cancel only the known waiting duplicate
        run: |
          node --input-type=module - <<'JS'
          const root='https://api.github.com/repos/g-jayden/range-christmas-observatory',headers={authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'};
          const api=async(path,method='GET')=>{const r=await fetch(root+path,{method,headers,signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Workflow queue HTTP '+r.status);return r.status===202||r.status===204?{status:r.status}:r.json();};
          for(const id of [44714082782]){const run=await api('/actions/runs/'+id);if(run.name!=='Recover exact native originals across retailers'||run.head_branch!=='main'||run.head_repository?.full_name!=='g-jayden/range-christmas-observatory')throw Error('Unrelated workflow cannot be cancelled');if(!['pending','queued','waiting','requested'].includes(run.status)){console.log(JSON.stringify({run:id,retained:true,status:run.status}));continue;}const jobs=await api('/actions/runs/'+id+'/jobs');if(jobs.jobs.some(j=>j.status==='in_progress'))throw Error('Active source capture must retain its evidence');const result=await api('/actions/runs/'+id+'/cancel','POST');console.log(JSON.stringify({run:id,cancelAccepted:result.status===202,onlyWaitingDuplicate:true,sourceRequests:0,firecrawlCredits:0}));}
          JS
