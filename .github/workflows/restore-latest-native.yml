name: Restore the latest archived originals without repeat collection
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  restore-saved-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: approved-native-image-recovery
      cancel-in-progress: false
      queue: max
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      NATIVE_RESTORE_RUN_ID: '44707707847'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/
            /web/*.mjs
            /web/*.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify the immutable archive and actual completed collector checkout
        run: node scripts/verify-latest-native-archive.mjs
      - name: Fetch the verified original billing base
        run: git fetch --filter=blob:none --depth=1 origin "$NATIVE_RESTORE_BASE_SHA"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-original-evidence-44707707847-1
          run-id: 44707707847
          github-token: ${{ github.token }}
          path: runtime/restore-native
      - name: Verify native hashes and restore only missing bytes
        run: node scripts/restore-native-artifact.mjs
      - name: Save missing photos and exact source bindings in bounded batches
        run: node scripts/publish-native-recovery.mjs
      - name: Publish originals without recollecting products
        run: node scripts/request-retailer-site-publish.mjs ar
