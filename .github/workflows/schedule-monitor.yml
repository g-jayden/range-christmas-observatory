name: Legacy NEW check entrypoint
on:
  workflow_dispatch:
    inputs:
      checkNow:
        type: boolean
        default: false
permissions:
  actions: write
jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Use the single free collector
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NEW: ${{ inputs.checkNow }}
        run: gh workflow run daily-pages.yml --repo "$GITHUB_REPOSITORY" -f refresh=false -f mode=verify-all -f checkNew="$CHECK_NEW"
