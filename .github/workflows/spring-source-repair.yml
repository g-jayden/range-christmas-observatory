name: Targeted spring source address proof
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: range-spring-address-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      SPRING_REPAIR_PATCH_ONLY: '1'
      EVIDENCE_NATIVE_ONLY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /server/
            /scripts/
            /cloud/
            /web/*.mjs
            /web/*.json
            /web/*.gz
            /web/spring/
            /web/spring-repair/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Reserve existing owner-authorised budget
        run: |
          node scripts/reserve-credits.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -- web/collection-ledger.json
          git diff --cached --quiet || git commit -m "Reserve targeted spring source-address proof [skip ci]"
          node scripts/push-evidence.mjs
      - name: Verify only unresolved exact SKU source addresses
        run: node server/repair-spring-source.mjs
      - name: Preserve isolated proof and actual receipt
        if: always()
        run: |
          git add --sparse -- web/spring-repair web/collection-ledger.json
          git diff --cached --quiet || git commit -m "Save exact-SKU spring alternate-address evidence [skip ci]"
          node scripts/push-evidence.mjs
