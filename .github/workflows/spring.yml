name: The Range spring botanical catalogue
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [all, review, repair, classify]
        default: all
      resume:
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: range-spring-source
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      COLLECTION_CHECKPOINTS: '1'
      EVIDENCE_NATIVE_ONLY: '1'
      COLLECTION_BUDGET_PHASE: spring-source
      SPRING_RESUME: ${{ inputs.resume && '1' || '0' }}
      SPRING_LOCAL_ONLY: ${{ inputs.phase == 'classify' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
            !/web/reports/
            !/web/mail-assets/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6.1.0
        id: local-model-cache
        with:
          path: runtime/models
          key: local-clip-vit-base-patch32-q8-preflight-v2
      - name: Verify local visual model before any paid source work
        id: vision
        run: node scripts/prepare-local-vision-model.mjs
      - name: Preserve prepared model even when a later source cannot be verified
        if: steps.local-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: runtime/models
          key: local-clip-vit-base-patch32-q8-preflight-v2
      - name: Configure evidence publisher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Reserve existing owner-authorised source budget
        if: inputs.phase != 'classify' && inputs.phase != 'review'
        run: |
          node scripts/reserve-credits.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse -- web/collection-ledger.json
          git diff --cached --quiet || git commit -m "Reserve spring free-first source collection [skip ci]"
          EVIDENCE_NATIVE_ONLY=1 node scripts/push-evidence.mjs
      - name: Read complete official source and only missing family details
        if: inputs.phase != 'review' && inputs.phase != 'repair' && inputs.phase != 'classify'
        run: node server/update-spring.mjs
      - name: Repair only unresolved official source addresses
        if: inputs.phase == 'repair'
        run: node server/repair-spring-source.mjs
      - name: Persist the next-stage reservation and collection evidence
        if: inputs.phase != 'classify'
        env:
          COLLECTION_BUDGET_PHASE: spring-photos
        run: |
          node scripts/reserve-credits.mjs
          node --input-type=module -e "import {publishCollectionCheckpoint} from './server/collection-checkpoints.mjs'; await publishCollectionCheckpoint({stage:'spring-photo-stage'});"
      - name: Restore committed source photos before image review
        run: node scripts/restore-spring-image-archive.mjs
      - name: Cross-check exact SKU descriptions and native product photos locally
        env:
          COLLECTION_BUDGET_PHASE: spring-photos
        run: node server/review-spring.mjs
      - name: Preserve official evidence and source receipts
        if: always()
        run: |
          git add --sparse -- web
          git diff --cached --quiet || git commit -m "Save official spring botanical source evidence [skip ci]"
          EVIDENCE_NATIVE_ONLY=1 node scripts/push-evidence.mjs
      - name: Enable reviewed baseline and the existing single daily PDF queue
        run: node scripts/sync-spring-service.mjs
      - name: Save baseline state
        run: |
          git add --sparse -- web/spring
          git diff --cached --quiet || git commit -m "Confirm spring baseline without historical NEW email flood [skip ci]"
          EVIDENCE_NATIVE_ONLY=1 node scripts/push-evidence.mjs
      - name: Publish the saved catalogue without recollection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/request-nx-site-publish.mjs
