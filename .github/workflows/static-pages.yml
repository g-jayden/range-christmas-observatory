name: Publish committed catalogues without source collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/images/**'
      - '!web/mail-assets/**'
      - '!web/reports/**'
      - '!web/evidence-repair-request.json'
      - '!web/asda/request.json'
      - 'scripts/**'
      - '!scripts/dispatch-approved-acceptance.mjs'
      - 'server/**'
      - 'cloud/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/static-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: range-readonly-pages-publication
  cancel-in-progress: false
  queue: single
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/web/images/
            !/web/bq/paid-source-checkpoints/
            !/web/bq/source-billing-history/
            !/web/reports/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Load current visual previews without historical native-image archives
        run: node scripts/hydrate-current-previews.mjs
      - run: npm ci --no-audit --no-fund
      - name: Reuse source-hash-bound display encodings
        uses: actions/cache/restore@v6.1.0
        with:
          path: runtime/card-preview-encodings
          key: card-preview-encodings-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: card-preview-encodings-v2-
      - name: Reuse reviewed B&Q source-image pixels without collection
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            runtime/bq-source
            runtime/bq-staged-catalogue.json
          key: bq-source-checkpoints-static-${{ github.run_id }}
          restore-keys: bq-source-checkpoints-
      - name: Reuse exact collector and OCR image pixels
        uses: actions/cache/restore@v6.1.0
        with:
          path: runtime/bq-previews
          key: bq-reviewed-preview-files-v1-static-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bq-reviewed-preview-files-v1-
      - name: Verify committed catalogue and publication logic without source requests
        run: npm test
      - name: Verify lossless large-catalogue transport and unchanged native files
        run: node scripts/test-static-json-transport.mjs
      - name: Restore this commit's catalogue after isolated tests
        run: node scripts/restore-committed-build-inputs.mjs
      - uses: actions/configure-pages@v6.0.0
      - name: Build directly from the committed current catalogue
        env:
          BROWSE_FETCH_VERIFIED_PREVIEWS: 'true'
        run: node scripts/build-static.mjs
      - name: Keep source-hash-bound display encodings
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: runtime/card-preview-encodings
          key: card-preview-encodings-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep exact reviewed B&Q preview pixels for future source-free builds
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            runtime/bq-source
            runtime/bq-staged-catalogue.json
          key: bq-source-checkpoints-preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep exact collector and OCR image pixels independently
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: runtime/bq-previews
          key: bq-reviewed-preview-files-v1-static-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Publish one immutable artifact with the shared deployment lease
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
          PAGES_ARTIFACT_NAME: github-pages-static-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/publish-pages.mjs
