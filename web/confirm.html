<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>确认新品邮件订阅</title><style>body{font:18px/1.8 system-ui;color:#173c32;max-width:680px;margin:5vh auto;padding:24px}label{display:block}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #ccd4ce;border-radius:8px}button{background:#17654a;border:0;color:white;border-radius:8px;padding:12px 20px;font:inherit;margin:16px 0}#result{white-space:pre-wrap}.muted{font-size:14px;color:#5c6b63}</style><h1>确认订阅新品邮件</h1><p>圣诞树与树裙每天北京时间 07:00 检查，有新款才通知。</p><form id="confirmForm"><label id="linkLabel">邮件中的完整确认链接<input id="confirmationLink" type="text" autocomplete="off" spellcheck="false" placeholder="粘贴邮件里的确认链接"></label><button id="confirmButton" type="submit">确认订阅新品邮件</button></form><p id="result" role="status"></p><p class="muted">确认链接只在本机解析，并直接提交到原邮件通知服务，不写入公开网站或采集日志。</p><a href="./">返回产品分析网站</a><script>
let token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);if(token){document.getElementById('linkLabel').hidden=true;}document.getElementById('confirmForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('confirmButton'),result=document.getElementById('result');button.disabled=true;try{if(!token){const u=new URL(document.getElementById('confirmationLink').value.trim());if(u.protocol!=='https:'||u.hostname!=='range-christmas-control.https-www-therange-co-uk-christmas-2.workers.dev'||u.pathname!=='/confirm')throw Error('请粘贴原确认邮件中的有效链接。');token=u.searchParams.get('token')||'';}if(!/^[a-zA-Z0-9-]{20,160}$/.test(token))throw Error('确认链接不完整。');const service=await fetch('service.json',{cache:'no-store'}).then(r=>r.json()),form=new FormData;form.set('token',token);const r=await fetch(service.apiBase+'/confirm',{method:'POST',body:form}),body=await r.text();if(!r.ok){let message;try{message=JSON.parse(body).error}catch{}throw Error(message||'确认没有完成，请稍后重试。')}if(!body.includes('订阅已确认'))throw Error('通知服务未返回确认成功。');result.textContent='订阅已确认。每天北京时间07:00检查，只有首次发现的新款才发邮件。';document.getElementById('confirmForm').hidden=true;token='';}catch(err){result.textContent=err.message;button.disabled=false;}});
</script></html>
