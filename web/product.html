<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新品信息卡与官网原图下载</title><style>body{font:17px/1.8 system-ui;color:#173c32;max-width:1000px;margin:auto;padding:24px}img{width:100%;height:auto;max-width:900px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.actions a{color:white;background:#17654a;text-decoration:none;padding:12px 18px;border-radius:8px}p{color:#53675d}#state{white-space:pre-wrap}</style><h1>新品信息卡与官网原图</h1><p id="state">正在读取具体 SKU 文件…</p><div id="content" hidden><div class="actions"><a id="card" download>保存完整信息卡 PNG</a><a id="original" download>下载官网原图</a><a id="proof" download hidden>下载原站商品页截图</a></div><p id="pixels"></p><a id="buy" target="_blank" rel="noopener">查看对应 SKU 原站购买页 ↗</a><p>手机预览经过屏幕缩放，下载文件保留标明的实际像素。原图保持源站原始字节，不放大缩略图，也不使用 AI 重绘。</p><img id="preview" alt="包含标题、商品图片、SKU、价格、高度、颜色、分类或材质的完整信息卡"></div><p><a href="./">返回分析网站</a></p><script>
(async()=>{try{const sku=new URLSearchParams(location.search).get('sku');if(!/^\d{1,12}$/.test(sku||''))throw Error('缺少有效 SKU。');const r=await fetch('mail-assets/'+sku+'/manifest.json',{cache:'no-store'});if(!r.ok)throw Error('该款尚未生成邮件下载文件。新品邮件发布后会在此提供完整信息卡与原图。');const m=await r.json();for(const [id,data]of [['card',m.card],['original',m.original],['proof',m.proof]])if(data){const a=document.getElementById(id);a.href=data.url;a.download=sku+'-'+id+(id==='original'?'.'+data.url.split('.').pop():'.png');a.hidden=false;}document.getElementById('preview').src=m.card.url;document.getElementById('buy').href=m.sourceUrl;document.getElementById('pixels').textContent=`官网原图 ${m.original.width} × ${m.original.height} 像素，${(m.original.bytes/1024).toFixed(0)} KB；完整信息卡 ${m.card.width} × ${m.card.height} 像素。原图未经放大或二次压缩。`;document.getElementById('state').textContent=m.name+' · SKU '+m.sku;document.getElementById('content').hidden=false;}catch(e){document.getElementById('state').textContent=e.message;}})();
</script></html>
